<title>Карта репозиториев</title>

<style>
  /* Палитра: картографическая тушь — глубокий сине-зелёный по бумаге.
     Нейтральные оттенки уведены в зелёно-серый, чтобы не читались случайными. */
  :root {
    --paper: #f4f6f5;
    --card: #ffffff;
    --ink: #16211f;
    --ink-soft: #566360;
    --ink-faint: #8b9794;
    --rule: #cfd8d5;
    --rule-soft: #e6ebe9;
    --accent: #0f6b5c;
    --accent-wash: #ddece8;
    --accent-halo: rgba(15, 107, 92, .14);
    --warn: #7d5410;
    --warn-wash: #f6eddc;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1413; --card: #171f1d; --ink: #e6ecea; --ink-soft: #9aa8a4;
      --ink-faint: #6b7975; --rule: #31403d; --rule-soft: #212c2a;
      --accent: #5ec9b0; --accent-wash: #17332d; --accent-halo: rgba(94, 201, 176, .16);
      --warn: #dcae5e; --warn-wash: #2d2517;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1413; --card: #171f1d; --ink: #e6ecea; --ink-soft: #9aa8a4;
    --ink-faint: #6b7975; --rule: #31403d; --rule-soft: #212c2a;
    --accent: #5ec9b0; --accent-wash: #17332d; --accent-halo: rgba(94, 201, 176, .16);
    --warn: #dcae5e; --warn-wash: #2d2517;
  }
  :root[data-theme="light"] {
    --paper: #f4f6f5; --card: #ffffff; --ink: #16211f; --ink-soft: #566360;
    --ink-faint: #8b9794; --rule: #cfd8d5; --rule-soft: #e6ebe9;
    --accent: #0f6b5c; --accent-wash: #ddece8; --accent-halo: rgba(15, 107, 92, .14);
    --warn: #7d5410; --warn-wash: #f6eddc;
  }

  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 36px 20px 90px; }

  /* ---------- «вы здесь» ---------- */
  .here {
    border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent-wash); padding: 18px 20px; margin-bottom: 22px;
  }
  .here .lbl {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }
  .here .rows { display: flex; flex-wrap: wrap; gap: 18px 34px; }
  .here .row span {
    display: block; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--ink-faint); margin-bottom: 1px;
  }
  .here .row b {
    font-family: var(--mono); font-size: 15px; font-weight: 600;
    color: var(--ink); word-break: break-all;
  }
  .here .row b.calm { color: var(--ink-soft); font-weight: 500; }
  .here .row b.flagged { color: var(--warn); }

  /* ---------- сводка ---------- */
  .stats { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule); margin-bottom: 18px; }
  .stat { flex: 1 1 120px; padding: 11px 16px 11px 0; border-right: 1px solid var(--rule-soft); }
  .stat:last-child { border-right: 0; }
  .stat b {
    display: block; font-family: var(--mono); font-size: 20px; font-weight: 600;
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .stat b.flagged { color: var(--warn); }
  .stat span {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint);
  }

  .search {
    width: 100%; box-sizing: border-box; margin-bottom: 26px;
    padding: 10px 13px; font-size: 14.5px; font-family: var(--mono);
    color: var(--ink); background: var(--card);
    border: 1px solid var(--rule); border-radius: 6px; transition: border-color .15s ease;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--ink-faint); font-family: var(--sans); }

  /* ---------- древо ---------- */
  .t { overflow-x: auto; padding-bottom: 8px; }
  .t ul { list-style: none; margin: 0; padding: 0 0 0 30px; }
  .t > ul { padding-left: 0; }
  .t li { position: relative; padding: 4px 0 4px 24px; }
  .t > ul > li { padding-left: 0; }

  /* Вертикальная жила от родителя и колено к каждому потомку —
     та же геометрия, что на родословных схемах. */
  .t li::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    border-left: 1px solid var(--rule);
  }
  .t li:last-child::before { bottom: auto; height: 21px; }
  .t li::after {
    content: ''; position: absolute; left: 0; top: 21px; width: 17px;
    border-top: 1px solid var(--rule);
  }
  .t > ul > li::before, .t > ul > li::after { display: none; }
  .t li.hidden { display: none; }

  .n {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    font-family: var(--mono); font-size: 13px; color: var(--ink);
  }
  .n.box {
    padding: 5px 11px; border: 1px solid var(--rule);
    border-radius: 6px; background: var(--card);
  }
  .n.tap { cursor: pointer; }
  .n.tap:hover { border-color: var(--accent); color: var(--accent); }
  .n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .n.owner { font-size: 15px; font-weight: 700; padding: 7px 14px; }
  .n.repo { font-size: 14px; font-weight: 600; }
  .n.group {
    border-style: dashed; color: var(--ink-soft); font-size: 12px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .n.file, .n.dir { color: var(--ink-soft); }
  .n.dir { color: var(--ink); }
  .n.note { color: var(--warn); font-style: italic; border-style: dashed; border-color: var(--warn); }
  .n.flag {
    color: var(--warn); background: var(--warn-wash);
    border-color: transparent; font-size: 12px;
  }
  .n.more { color: var(--ink-faint); font-style: italic; font-size: 12px; }

  /* Текущее положение: единственное место на странице с заливкой и ореолом,
     чтобы взгляд находил его раньше всего остального. */
  .n.cur {
    border-color: var(--accent); background: var(--accent-wash);
    color: var(--accent); font-weight: 700;
    box-shadow: 0 0 0 4px var(--accent-halo);
  }
  .n .arw { color: var(--ink-faint); width: 10px; flex: none; }
  .n.cur .arw { color: var(--accent); }
  .n .tag {
    font-family: var(--sans); font-size: 10.5px; letter-spacing: .04em;
    color: var(--ink-faint); text-transform: none; flex: none;
  }
  .n .tag.loose { color: var(--warn); }
  .n .tag.badge {
    background: var(--accent); color: var(--paper); font-weight: 700;
    padding: 1px 7px; border-radius: 10px; letter-spacing: .06em;
  }
  .n a { color: inherit; text-decoration: none; }
  .n a:hover { text-decoration: underline; }
  .hit { background: var(--accent-wash); color: var(--accent); border-radius: 2px; }

  .noresult { text-align: center; color: var(--ink-faint); padding: 40px 0; display: none; }
  .noresult.on { display: block; }
  .foot { margin-top: 30px; font-size: 12.5px; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div id="here"></div>
  <div class="stats" id="stats"></div>
  <input class="search" id="q" type="search"
         placeholder="Фильтр: репозиторий, ветка, файл…" autocomplete="off">
  <div class="t" id="tree"></div>
  <div class="noresult" id="noresult">Ничего не найдено</div>
  <div class="foot" id="foot"></div>
</div>

<script>
  const DATA = __REPO_MAP_DATA__;

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  function human(d) {
    if (!d) return '';
    const p = String(d).slice(0, 10).split('-');
    if (p.length < 3) return String(d);
    return Number(p[2]) + ' ' + (MONTHS[Number(p[1]) - 1] || '') + ' ' + p[0];
  }
  function plural(n, one, few, many) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
    return many;
  }

  const repos = (DATA.repos || []).slice().sort((a, b) =>
    String(b.pushedAt || '').localeCompare(String(a.pushedAt || '')));

  // ---------- «вы здесь» ----------
  const cur = DATA.current;
  if (cur) {
    const rows = [
      ['репозиторий', esc(cur.repo), ''],
      ['ветка', esc(cur.branch), '']
    ];
    if (cur.dirty != null) {
      rows.push(['не сохранено', cur.dirty
        ? cur.dirty + ' ' + plural(cur.dirty, 'файл', 'файла', 'файлов')
        : 'ничего', cur.dirty ? 'flagged' : 'calm']);
    }
    if (cur.note) rows.push(['состояние', esc(cur.note), 'calm']);
    document.getElementById('here').innerHTML =
      '<div class="here"><div class="lbl">Вы здесь</div><div class="rows">' +
      rows.map(r => '<div class="row"><span>' + r[0] + '</span><b class="' + r[2] + '">' +
        r[1] + '</b></div>').join('') + '</div></div>';
  }

  // ---------- сводка ----------
  const branchCount = repos.reduce((n, r) => n + (r.branches || []).length, 0);
  const loose = repos.reduce((n, r) =>
    n + (r.branches || []).filter(b => !b.isDefault && !b.pr).length, 0);
  const openPRs = repos.reduce((n, r) => n + (r.pulls || []).length, 0);

  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + repos.length + '</b><span>' +
      plural(repos.length, 'репозиторий', 'репозитория', 'репозиториев') + '</span></div>' +
    '<div class="stat"><b>' + branchCount + '</b><span>' +
      plural(branchCount, 'ветка', 'ветки', 'веток') + '</span></div>' +
    '<div class="stat"><b class="' + (loose ? 'flagged' : '') + '">' + loose +
      '</b><span>без pull request</span></div>' +
    '<div class="stat"><b>' + openPRs + '</b><span>открытых PR</span></div>' +
    '<div class="stat"><b>' + esc(human(DATA.generatedAt)) + '</b><span>собрано</span></div>';

  // ---------- сборка древа ----------
  function fileNodes(nodes, depth) {
    return (nodes || []).map(n => {
      if (n.type === 'dir') {
        return { label: n.name + '/', kind: 'dir', open: depth < 1,
                 children: fileNodes(n.children, depth + 1) };
      }
      if (n.type === 'more') return { label: n.name, kind: 'more' };
      return { label: n.name, kind: 'file' };
    });
  }

  function repoNode(r) {
    const kids = [];

    // Незакрытые хвосты идут отдельными узлами, а не строкой подписи:
    // в подписи они переполняют строку и уезжают за край экрана.
    (r.flags || []).forEach(f => kids.push({ label: f.text, kind: 'flag' }));

    if ((r.branches || []).length) {
      kids.push({
        label: 'ветки · ' + r.branches.length, kind: 'group', open: !!r.isCurrent,
        children: r.branches.map(b => ({
          label: b.name, kind: 'branch', current: !!b.isCurrent,
          tag: b.isDefault ? 'основная' : b.pr ? 'PR #' + b.pr : 'без PR',
          loose: !b.isDefault && !b.pr
        }))
      });
    }
    if ((r.pulls || []).length) {
      kids.push({
        label: 'открытые PR · ' + r.pulls.length, kind: 'group', open: !!r.isCurrent,
        children: r.pulls.map(p => ({
          label: '#' + p.number + ' ' + p.title, kind: 'file', url: p.url,
          tag: p.ageDays != null
            ? 'стоит ' + p.ageDays + ' ' + plural(p.ageDays, 'день', 'дня', 'дней') : ''
        }))
      });
    }
    if (r.unreachable) {
      kids.push({ label: 'не подключён к сессии — содержимое не читалось', kind: 'note' });
    } else if ((r.tree || []).length) {
      kids.push({ label: 'файлы', kind: 'group', open: !!r.isCurrent,
                  children: fileNodes(r.tree, 0) });
    }

    const tags = [r.visibility === 'private' ? 'приватный' : 'публичный'];
    if (r.pushedAt) tags.push(human(r.pushedAt));

    return {
      label: r.name, kind: 'repo', current: !!r.isCurrent, url: r.url,
      open: !!r.isCurrent, tag: tags.join(' · '), children: kids
    };
  }

  const ROOT = {
    label: DATA.owner, kind: 'owner', open: true, children: repos.map(repoNode)
  };

  // ---------- отрисовка ----------
  function nodeHTML(n) {
    const has = (n.children || []).length;
    const cls = ['n', n.kind];
    if (n.kind !== 'file' && n.kind !== 'more' && n.kind !== 'dir') cls.push('box');
    if (n.kind === 'dir') cls.push('box');
    if (n.current) cls.push('cur');
    if (has) cls.push('tap');

    let inner = '';
    if (has) inner += '<span class="arw">' + (n.open ? '▾' : '▸') + '</span>';
    inner += n.url
      ? '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.label) + '</a>'
      : esc(n.label);
    if (n.current) inner += '<span class="tag badge">вы здесь</span>';
    if (n.tag) inner += '<span class="tag' + (n.loose ? ' loose' : '') + '">' + esc(n.tag) + '</span>';

    const attrs = has ? ' role="button" tabindex="0" aria-expanded="' + (n.open ? 'true' : 'false') + '"' : '';
    let h = '<li data-name="' + esc(n.label).toLowerCase() + '"' + (n.open ? ' class="open"' : '') + '>' +
      '<span class="' + cls.join(' ') + '"' + attrs + '>' + inner + '</span>';
    if (has) {
      h += '<ul' + (n.open ? '' : ' hidden') + '>' +
        n.children.map(nodeHTML).join('') + '</ul>';
    }
    return h + '</li>';
  }

  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '<ul>' + nodeHTML(ROOT) + '</ul>';

  function toggle(el) {
    const li = el.parentElement;
    const ul = li.querySelector(':scope > ul');
    if (!ul) return;
    const open = ul.hasAttribute('hidden');
    if (open) ul.removeAttribute('hidden'); else ul.setAttribute('hidden', '');
    el.querySelector('.arw').textContent = open ? '▾' : '▸';
    el.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  treeEl.addEventListener('click', e => {
    const n = e.target.closest('.n.tap');
    if (n && e.target.tagName !== 'A') toggle(n);
  });
  treeEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const n = e.target.closest('.n.tap');
    if (n) { e.preventDefault(); toggle(n); }
  });

  // ---------- фильтр ----------
  const q = document.getElementById('q');
  const noresult = document.getElementById('noresult');
  const allLi = [...treeEl.querySelectorAll('li')];

  function open(li, yes) {
    const ul = li.querySelector(':scope > ul');
    if (!ul) return;
    if (yes) ul.removeAttribute('hidden'); else ul.setAttribute('hidden', '');
    const a = li.querySelector(':scope > .n .arw');
    if (a) a.textContent = yes ? '▾' : '▸';
  }

  q.addEventListener('input', () => {
    const term = q.value.trim().toLowerCase();

    treeEl.querySelectorAll('.hit').forEach(el =>
      el.replaceWith(document.createTextNode(el.textContent)));
    treeEl.normalize();

    if (!term) {
      allLi.forEach(li => {
        li.classList.remove('hidden');
        open(li, li.classList.contains('open'));
      });
      noresult.classList.remove('on');
      return;
    }

    let found = 0;
    allLi.forEach(li => li.classList.add('hidden'));

    allLi.forEach(li => {
      if (!li.dataset.name.includes(term)) return;
      found++;
      li.classList.remove('hidden');
      // подсветить совпадение в самой подписи
      const label = li.querySelector(':scope > .n');
      const txt = [...label.childNodes].find(n =>
        n.nodeType === 3 ? n.textContent.trim()
          : n.tagName === 'A' && n.textContent.toLowerCase().includes(term));
      const target = txt && txt.nodeType === 1 ? txt.firstChild : txt;
      if (target && target.nodeType === 3) {
        const i = target.textContent.toLowerCase().indexOf(term);
        if (i > -1) {
          const span = document.createElement('span');
          span.className = 'hit';
          span.textContent = target.textContent.slice(i, i + term.length);
          const after = target.splitText(i);
          after.textContent = after.textContent.slice(term.length);
          target.parentNode.insertBefore(span, after);
        }
      }
      // раскрыть всех предков
      let p = li.parentElement.closest('li');
      while (p) { p.classList.remove('hidden'); open(p, true); p = p.parentElement.closest('li'); }
      // и показать потомков
      li.querySelectorAll('li').forEach(d => d.classList.remove('hidden'));
      open(li, true);
    });

    noresult.classList.toggle('on', found === 0);
  });

  document.getElementById('foot').textContent =
    'Клик по узлу разворачивает ветвь. Отметка «вы здесь» — текущий репозиторий и ветка.';
</script>
