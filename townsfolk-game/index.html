<!DOCTYPE html>
<html lang="ru-RU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Городок — стратегия по мотивам TownsFolk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2317151d'/%3E%3Crect x='3' y='7' width='10' height='6' fill='%23c9b998'/%3E%3Cpath d='M2 7l6-4 6 4z' fill='%23a34f3f'/%3E%3Crect x='7' y='9' width='2' height='4' fill='%235c4327'/%3E%3C/svg%3E">
  <!-- PWA: приложение на домашнем экране -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Городок">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">

    <!-- Карта на весь экран -->
    <div id="map-scroll">
      <div class="map-inner">
        <canvas id="map" width="1440" height="852"></canvas>
      </div>
    </div>

    <!-- Верхняя панель -->
    <header class="hud-top">
      <div class="panel hud-day">
        <img class="hud-day__crest" id="crest" alt="">
        <div>
          <div class="hud-day__label">ДЕНЬ <b id="turn-label">1</b></div>
          <div class="hud-day__tribute" id="tribute-label">До дани: 12 дн.</div>
        </div>
        <div class="hud-day__controls">
          <button class="mini-btn" id="btn-endday" title="Следующий день (Пробел)">▶</button>
          <button class="mini-btn" id="btn-skip3" title="Пропустить 3 дня">⏩</button>
        </div>
      </div>

      <div class="panel hud-res" id="resbar" aria-label="Ресурсы">
        <span class="res" title="Жители (всего/лимит, +свободные)"><img class="ico" id="ico-pop" alt="👥"><span><b id="r-pop">4/6</b><i id="d-pop">+4</i></span></span>
        <span class="res" title="Еда"><img class="ico" id="ico-food" alt="🍞"><span><b id="r-food">25</b><i id="d-food">−4</i></span></span>
        <span class="res" title="Производство"><img class="ico" id="ico-prod" alt="⚒️"><span><b id="r-prod">14</b><i id="d-prod">+2</i></span></span>
        <span class="res" title="Золото"><img class="ico" id="ico-gold" alt="🪙"><span><b id="r-gold">12</b><i id="d-gold">+1</i></span></span>
        <span class="res" title="Вера"><img class="ico" id="ico-faith" alt="✨"><span><b id="r-faith">2</b><i id="d-faith">+0</i></span></span>
        <span class="res" title="Очки знаний"><img class="ico" id="ico-sci" alt="🔬"><span><b id="r-sci">0</b><i id="d-sci">+1</i></span></span>
      </div>

      <div class="hud-corner">
        <button class="panel icon-btn" id="btn-help" title="Как играть (H)"><img id="ico-help" alt="❓"></button>
        <button class="panel icon-btn" id="btn-tech" title="Технологии (T)">⭐</button>
        <button class="panel icon-btn" id="btn-newgame" title="Новая партия"><img id="ico-gear" alt="🔁"></button>
      </div>
    </header>

    <!-- Цели -->
    <aside class="panel objectives" id="objectives">
      <h4>ЦЕЛИ</h4>
      <div id="obj-list"></div>
    </aside>

    <!-- Боковые кнопки -->
    <div class="side-buttons">
      <button class="panel side-btn" id="btn-events"><span class="side-btn__ico">⚜️</span><span>СОБЫТИЯ</span><span class="badge" id="badge-events" hidden></span></button>
      <button class="panel side-btn" id="btn-log"><span class="side-btn__ico">📜</span><span>ЛЕТОПИСЬ</span><span class="badge" id="badge-log" hidden></span></button>
    </div>

    <!-- Мини-карта и зум -->
    <div class="minimap-wrap">
      <div class="zoom">
        <button class="panel mini-btn" id="z-in" title="Приблизить (+ или колесо мыши)">＋</button>
        <button class="panel mini-btn" id="z-out" title="Отдалить (−)">－</button>
      </div>
      <div class="panel minimap"><canvas id="minimap" width="120" height="76"></canvas></div>
    </div>

    <!-- Инфо о выбранном тайле -->
    <section class="panel tile-info" id="panel" hidden></section>

    <!-- Нижняя панель строительства -->
    <footer class="buildbar">
      <div class="tabs" id="build-tabs"></div>
      <div class="panel cards-wrap"><div class="cards" id="build-cards"></div></div>
    </footer>

    <!-- Главная кнопка -->
    <button class="big-day" id="btn-bigday"><img class="big-day__ico" id="ico-day" alt="🌙"><span>НОВЫЙ<br>ДЕНЬ</span></button>

    <!-- Летопись -->
    <div class="log-overlay panel" id="log-overlay" hidden>
      <h4>ЛЕТОПИСЬ <button class="mini-btn log-close" id="btn-log-close">✕</button></h4>
      <section class="log" id="log" aria-live="polite"></section>
    </div>

    <!-- Модальное окно-карточка -->
    <div class="modal-overlay" id="modal" hidden>
      <div class="modal panel" role="dialog" aria-modal="true">
        <img id="modal-pic" class="modal__pic" alt="" hidden>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <div class="modal__buttons" id="modal-buttons"></div>
      </div>
    </div>

  </div>

  <script src="assets.js"></script>
  <script src="game.js"></script>
  <script>
    // офлайн-режим: регистрируем сервис-воркер (не в file:// и не в песочницах)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
