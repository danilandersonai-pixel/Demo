<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Coding Journal</title>
    <style>
      :root {
        --bg: #0e0f13;
        --bg-elev: #16181f;
        --bg-card: #1c1f29;
        --border: #2a2f3d;
        --text: #e7e9ee;
        --muted: #8b91a3;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        --danger: #ef4444;
        --radius: 12px;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset,
          0 8px 24px rgba(0, 0, 0, 0.35);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(139,92,246,.18), transparent 60%),
          radial-gradient(900px 500px at -10% 10%, rgba(34,211,238,.12), transparent 60%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .topbar {
        position: sticky; top: 0; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; padding: 14px 24px;
        backdrop-filter: blur(10px);
        background: rgba(14,15,19,.7);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
      .logo { font-size: 18px; color: var(--accent); filter: drop-shadow(0 0 8px rgba(139,92,246,.7)); }
      .actions { display: flex; align-items: center; gap: 8px; }
      .actions input[type="search"] { width: 320px; max-width: 40vw; }
      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 460px) 1fr;
        gap: 24px; padding: 24px;
        max-width: 1400px; margin: 0 auto;
      }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .actions input[type="search"] { width: 180px; }
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
      }
      .editor { position: sticky; top: 80px; align-self: start; }
      h2 {
        margin: 0 0 14px 0; font-size: 15px; font-weight: 600;
        color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
      }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
      .field span { font-size: 12px; color: var(--muted); }
      input[type="text"], input[type="search"], input[type="date"], textarea {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit; outline: none;
        transition: border-color .15s, box-shadow .15s;
      }
      input:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(139,92,246,.18);
      }
      textarea {
        resize: vertical; min-height: 80px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13.5px; line-height: 1.5;
      }
      .prompts {
        border: 1px dashed var(--border);
        border-radius: 10px; padding: 12px;
        margin: 4px 0 14px 0;
      }
      .prompts legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
      .prompt-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
      .prompt-row .prompt-title { grid-column: 1 / 2; }
      .prompt-row .remove-prompt { grid-column: 2 / 3; align-self: start; }
      .prompt-row .prompt-body { grid-column: 1 / 3; }
      .form-actions { display: flex; justify-content: flex-end; gap: 8px; }
      button {
        cursor: pointer; border-radius: 10px; padding: 9px 14px;
        font: inherit;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text);
        transition: transform .05s ease, background .15s, border-color .15s;
      }
      button:hover { border-color: #3a4154; }
      button:active { transform: translateY(1px); }
      .primary {
        background: linear-gradient(135deg, var(--accent), #6d28d9);
        border-color: transparent; color: white; font-weight: 600;
      }
      .primary:hover { filter: brightness(1.08); }
      .ghost { background: transparent; }
      .feed-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
      .muted { color: var(--muted); font-size: 13px; }
      .empty-state { text-align: center; padding: 40px 16px; }
      #entries { display: flex; flex-direction: column; gap: 14px; }
      .entry { padding: 16px 18px; }
      .entry-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; margin-bottom: 10px;
      }
      .entry-date { font-weight: 600; letter-spacing: .01em; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .tag {
        font-size: 11px; padding: 3px 8px; border-radius: 999px;
        background: rgba(139,92,246,.12); color: #c4b5fd;
        border: 1px solid rgba(139,92,246,.3);
      }
      .entry-actions { display: flex; gap: 4px; opacity: .7; }
      .entry-actions button { padding: 4px 8px; font-size: 13px; }
      .entry-notes {
        white-space: pre-wrap; line-height: 1.55;
        font-size: 14.5px; margin-bottom: 12px;
      }
      .entry-prompts { display: flex; flex-direction: column; gap: 8px; }
      .prompt-card {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent-2);
        border-radius: 8px; padding: 10px 12px;
      }
      .prompt-card .pt { font-size: 12px; color: var(--accent-2); margin-bottom: 4px; font-weight: 600; }
      .prompt-card .pb {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px; white-space: pre-wrap; line-height: 1.5; color: #d6d9e2;
      }
      .delete-btn:hover { color: var(--danger); border-color: var(--danger); }
      label.ghost {
        display: inline-flex; align-items: center; cursor: pointer;
        padding: 9px 14px; border: 1px solid var(--border);
        border-radius: 10px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◉</span>
        <h1>Vibe Coding Journal</h1>
      </div>
      <div class="actions">
        <input id="search" type="search" placeholder="Поиск по записям, промптам, тегам…" autocomplete="off" />
        <button id="export-btn" class="ghost" title="Экспорт в JSON">⇪ Экспорт</button>
        <label class="ghost" title="Импорт JSON">
          ⇩ Импорт
          <input id="import-input" type="file" accept="application/json" hidden />
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="editor card">
        <h2>Новая запись</h2>
        <form id="entry-form">
          <div class="row">
            <label class="field"><span>Дата</span><input id="entry-date" type="date" required /></label>
            <label class="field"><span>Теги</span><input id="entry-tags" type="text" placeholder="react, refactor, claude" /></label>
          </div>
          <label class="field">
            <span>Что кодил + инсайты</span>
            <textarea id="entry-notes" rows="8" placeholder="Над чем работал, что получилось, что понял…" required></textarea>
          </label>
          <fieldset class="prompts">
            <legend>Удачные AI-промпты</legend>
            <div id="prompts-list"></div>
            <button type="button" id="add-prompt" class="ghost">+ Добавить промпт</button>
          </fieldset>
          <div class="form-actions">
            <button type="button" id="cancel-edit" class="ghost" hidden>Отмена</button>
            <button type="submit" id="save-btn" class="primary">Сохранить</button>
          </div>
        </form>
      </section>

      <section class="feed">
        <div class="feed-header">
          <h2>Лента</h2>
          <span id="stats" class="muted"></span>
        </div>
        <div id="entries"></div>
        <p id="empty" class="muted empty-state" hidden>Пока пусто. Запиши, над чем сегодня кодил.</p>
      </section>
    </main>

    <template id="entry-template">
      <article class="entry card">
        <header class="entry-head">
          <div>
            <time class="entry-date"></time>
            <div class="tags"></div>
          </div>
          <div class="entry-actions">
            <button class="ghost edit-btn" title="Редактировать">✎</button>
            <button class="ghost delete-btn" title="Удалить">✕</button>
          </div>
        </header>
        <div class="entry-notes"></div>
        <div class="entry-prompts"></div>
      </article>
    </template>

    <template id="prompt-template">
      <div class="prompt-row">
        <input class="prompt-title" type="text" placeholder="Краткое название" />
        <textarea class="prompt-body" rows="3" placeholder="Текст промпта"></textarea>
        <button type="button" class="ghost remove-prompt" title="Удалить">✕</button>
      </div>
    </template>

    <script>
      (() => {
        "use strict";
        const STORAGE_KEY = "vibe-journal:entries:v1";
        const form = document.getElementById("entry-form");
        const dateInput = document.getElementById("entry-date");
        const tagsInput = document.getElementById("entry-tags");
        const notesInput = document.getElementById("entry-notes");
        const promptsList = document.getElementById("prompts-list");
        const addPromptBtn = document.getElementById("add-prompt");
        const cancelEditBtn = document.getElementById("cancel-edit");
        const saveBtn = document.getElementById("save-btn");
        const entriesEl = document.getElementById("entries");
        const emptyEl = document.getElementById("empty");
        const statsEl = document.getElementById("stats");
        const searchInput = document.getElementById("search");
        const exportBtn = document.getElementById("export-btn");
        const importInput = document.getElementById("import-input");
        const entryTpl = document.getElementById("entry-template");
        const promptTpl = document.getElementById("prompt-template");

        let entries = load();
        let editingId = null;
        let filter = "";

        function load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch { return []; }
        }
        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
        function todayISO() {
          const d = new Date();
          const tz = d.getTimezoneOffset() * 60000;
          return new Date(d - tz).toISOString().slice(0, 10);
        }
        function parseTags(str) {
          return str.split(",").map((t) => t.trim()).filter(Boolean);
        }
        function formatDate(iso) {
          try {
            const d = new Date(iso + "T00:00:00");
            return d.toLocaleDateString("ru-RU", {
              weekday: "short", day: "2-digit", month: "long", year: "numeric",
            });
          } catch { return iso; }
        }
        function addPromptRow(value = { title: "", body: "" }) {
          const node = promptTpl.content.firstElementChild.cloneNode(true);
          node.querySelector(".prompt-title").value = value.title || "";
          node.querySelector(".prompt-body").value = value.body || "";
          node.querySelector(".remove-prompt").addEventListener("click", () => node.remove());
          promptsList.appendChild(node);
        }
        function readPrompts() {
          const rows = [...promptsList.querySelectorAll(".prompt-row")];
          return rows.map((r) => ({
            title: r.querySelector(".prompt-title").value.trim(),
            body: r.querySelector(".prompt-body").value.trim(),
          })).filter((p) => p.title || p.body);
        }
        function resetForm() {
          editingId = null;
          form.reset();
          dateInput.value = todayISO();
          promptsList.innerHTML = "";
          addPromptRow();
          saveBtn.textContent = "Сохранить";
          cancelEditBtn.hidden = true;
        }
        function startEdit(entry) {
          editingId = entry.id;
          dateInput.value = entry.date;
          tagsInput.value = entry.tags.join(", ");
          notesInput.value = entry.notes;
          promptsList.innerHTML = "";
          if (entry.prompts.length === 0) addPromptRow();
          else entry.prompts.forEach(addPromptRow);
          saveBtn.textContent = "Обновить";
          cancelEditBtn.hidden = false;
          form.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        function deleteEntry(id) {
          if (!confirm("Удалить запись?")) return;
          entries = entries.filter((e) => e.id !== id);
          save();
          render();
          if (editingId === id) resetForm();
        }
        function matches(entry, q) {
          if (!q) return true;
          const hay = [
            entry.date, entry.notes, entry.tags.join(" "),
            ...entry.prompts.flatMap((p) => [p.title, p.body]),
          ].join("\n").toLowerCase();
          return hay.includes(q.toLowerCase());
        }
        function render() {
          const sorted = [...entries].sort((a, b) =>
            a.date < b.date ? 1 : a.date > b.date ? -1 : 0
          );
          const visible = sorted.filter((e) => matches(e, filter));
          entriesEl.innerHTML = "";
          visible.forEach((entry) => {
            const node = entryTpl.content.firstElementChild.cloneNode(true);
            node.dataset.id = entry.id;
            node.querySelector(".entry-date").textContent = formatDate(entry.date);
            const tagsEl = node.querySelector(".tags");
            entry.tags.forEach((t) => {
              const tag = document.createElement("span");
              tag.className = "tag";
              tag.textContent = "#" + t;
              tagsEl.appendChild(tag);
            });
            node.querySelector(".entry-notes").textContent = entry.notes;
            const promptsEl = node.querySelector(".entry-prompts");
            entry.prompts.forEach((p) => {
              const card = document.createElement("div");
              card.className = "prompt-card";
              if (p.title) {
                const t = document.createElement("div");
                t.className = "pt"; t.textContent = p.title;
                card.appendChild(t);
              }
              if (p.body) {
                const b = document.createElement("div");
                b.className = "pb"; b.textContent = p.body;
                card.appendChild(b);
              }
              promptsEl.appendChild(card);
            });
            node.querySelector(".edit-btn").addEventListener("click", () => startEdit(entry));
            node.querySelector(".delete-btn").addEventListener("click", () => deleteEntry(entry.id));
            entriesEl.appendChild(node);
          });
          emptyEl.hidden = visible.length !== 0;
          if (entries.length === 0) emptyEl.textContent = "Пока пусто. Запиши, над чем сегодня кодил.";
          else if (visible.length === 0) emptyEl.textContent = "Ничего не найдено по запросу.";
          const totalPrompts = entries.reduce((n, e) => n + e.prompts.length, 0);
          statsEl.textContent = `${entries.length} записей · ${totalPrompts} промптов`;
        }

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const entry = {
            id: editingId || uid(),
            date: dateInput.value || todayISO(),
            tags: parseTags(tagsInput.value),
            notes: notesInput.value.trim(),
            prompts: readPrompts(),
          };
          if (!entry.notes) return;
          if (editingId) entries = entries.map((x) => (x.id === editingId ? entry : x));
          else entries.push(entry);
          save();
          resetForm();
          render();
        });
        addPromptBtn.addEventListener("click", () => addPromptRow());
        cancelEditBtn.addEventListener("click", resetForm);
        searchInput.addEventListener("input", (e) => { filter = e.target.value; render(); });
        exportBtn.addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `vibe-journal-${todayISO()}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });
        importInput.addEventListener("change", async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!Array.isArray(data)) throw new Error("invalid format");
            const existing = new Map(entries.map((x) => [x.id, x]));
            data.forEach((item) => {
              if (item && item.id && item.date && typeof item.notes === "string") {
                existing.set(item.id, {
                  id: item.id, date: item.date,
                  tags: Array.isArray(item.tags) ? item.tags : [],
                  notes: item.notes,
                  prompts: Array.isArray(item.prompts) ? item.prompts : [],
                });
              }
            });
            entries = [...existing.values()];
            save();
            render();
          } catch (err) {
            alert("Не удалось импортировать: " + err.message);
          } finally {
            importInput.value = "";
          }
        });

        resetForm();
        render();
      })();
    </script>
  </body>
</html>
