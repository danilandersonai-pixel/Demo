<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конвейер «Твой урок»</title>
<style>
  /* ── Токены. Светлая палитра — на голом :root, чтобы страница жила
       и в «системной» теме, где на корне не стоит ни одной метки. ── */
  :root {
    --canvas:      #EEF0F4;
    --dot:         #C9CFDA;
    --surface:     #FFFFFF;
    --surface-2:   #F7F8FB;
    --border:      #DDE2EA;
    --border-firm: #C3CAD8;
    --ink:         #1B2130;
    --ink-muted:   #67718A;
    --ink-faint:   #96A0B4;
    --accent:      #8A2434;
    --accent-soft: #F3E4E7;
    --edge:        #B7BECD;
    --ok:          #1F8A5B;
    --ok-soft:     #E3F3EB;
    --shadow:      0 1px 2px rgba(27,33,48,.06), 0 4px 12px rgba(27,33,48,.07);
    --shadow-lift: 0 2px 4px rgba(27,33,48,.08), 0 12px 32px rgba(27,33,48,.14);

    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;

    --z: 1;   /* масштаб холста; на узком экране стартует меньше единицы */
  }

  /* Тёмная тема через системную настройку — но явный выбор «светлая» её бьёт */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:      #141821;
      --dot:         #2B3242;
      --surface:     #1E242F;
      --surface-2:   #262D3A;
      --border:      #333B4B;
      --border-firm: #465063;
      --ink:         #E8EBF2;
      --ink-muted:   #9AA5BC;
      --ink-faint:   #6E7893;
      --accent:      #E08A97;
      --accent-soft: #3A2229;
      --edge:        #4A5568;
      --ok:          #4BC98D;
      --ok-soft:     #16302A;
      --shadow:      0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.5);
    }
  }
  /* И явный выбор «тёмная» бьёт светлую систему */
  :root[data-theme="dark"] {
    --canvas:      #141821;
    --dot:         #2B3242;
    --surface:     #1E242F;
    --surface-2:   #262D3A;
    --border:      #333B4B;
    --border-firm: #465063;
    --ink:         #E8EBF2;
    --ink-muted:   #9AA5BC;
    --ink-faint:   #6E7893;
    --accent:      #E08A97;
    --accent-soft: #3A2229;
    --edge:        #4A5568;
    --ok:          #4BC98D;
    --ok-soft:     #16302A;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* Явный фон обязателен: прозрачное тело подхватит чужую тему */
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    height: 100dvh;   /* на телефоне адресная строка не должна резать холст */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Верхняя полоса ─────────────────────────────────────────── */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 30;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 0 1 auto; }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.01em;
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand .sub {
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spacer { flex: 1; }

  .toggle {
    display: flex;
    flex: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .toggle button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 550;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .toggle button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .toggle button:focus-visible,
  .node:focus-visible,
  .sheet-close:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .zoom {
    display: flex;
    flex: none;
    align-items: center;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px;
  }
  .zoom button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-muted);
    font: inherit;
    font-size: 15px;
    line-height: 1;
    width: 26px; height: 24px;
    border-radius: 6px;
    cursor: pointer;
  }
  .zoom button:hover:not(:disabled) { background: var(--surface); color: var(--ink); }
  .zoom button:disabled { opacity: .35; cursor: default; }
  .zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .zoom .val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .runline {
    display: none;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ok);
    white-space: nowrap;
  }
  body.run .runline { display: flex; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px var(--ok-soft);
  }

  /* ── Холст ──────────────────────────────────────────────────── */
  .viewport {
    flex: 1;
    overflow-x: auto;
    overflow-y: auto;
    position: relative;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    /* Точки живут на скролл-контейнере, а не на холсте: так они не
       мельчают при уменьшении масштаба и покрывают всё поле целиком. */
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
    background-position: -1px -1px;
    background-attachment: local;
  }
  /* Обёртка держит габариты за масштабированный холст — иначе скролл
     не знает, сколько места занимает содержимое после scale(). */
  .stage {
    position: relative;
    width:  calc(2160px * var(--z));
    height: calc(680px  * var(--z));
  }
  /* Пока панель открыта, холсту добавляется запас снизу — иначе
     выбранную ноду некуда прокрутить из-под панели. */
  body.picking .stage { margin-bottom: 70vh; }
  .canvas {
    position: relative;
    width: 2160px;
    height: 680px;
    transform: scale(var(--z));
    transform-origin: 0 0;
  }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wire {
    fill: none;
    stroke: var(--edge);
    stroke-width: 1.75;
    transition: stroke .2s;
  }
  body.run .wire { stroke: var(--ok); stroke-opacity: .55; }
  .wire.lit { stroke: var(--accent); stroke-width: 2.25; stroke-opacity: 1; }

  .count {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    fill: var(--ok);
  }
  .count-bg { fill: var(--surface); stroke: var(--ok); stroke-width: 1; }
  .counts { opacity: 0; transition: opacity .25s; }
  body.run .counts { opacity: 1; }

  /* ── Нода ───────────────────────────────────────────────────── */
  .node {
    position: absolute;
    width: 96px;
    padding: 0;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: center;
  }
  .box {
    position: relative;
    width: 96px; height: 96px;
    background: var(--surface);
    border: 1px solid var(--border-firm);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: grid;
    place-items: center;
    transition: transform .16s, box-shadow .16s, border-color .16s;
  }
  /* Триггер: левый край скруглён сильно — как в n8n */
  .node.trigger .box { border-radius: 48px 14px 14px 48px; }

  .node:hover .box { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .node[aria-current="true"] .box {
    border-color: var(--accent);
    box-shadow: var(--shadow-lift), 0 0 0 3px var(--accent-soft);
  }
  body.run .node .box { border-color: var(--ok); }
  body.run .node[aria-current="true"] .box { border-color: var(--accent); }

  .box svg { width: 30px; height: 30px; stroke: var(--ink-muted); fill: none;
             stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .node[aria-current="true"] .box svg { stroke: var(--accent); }
  body.run .box svg { stroke: var(--ink); }

  .tick {
    position: absolute;
    right: -7px; top: -7px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ok);
    display: grid; place-items: center;
    opacity: 0;
    transform: scale(.6);
    transition: opacity .2s, transform .2s;
  }
  .tick svg { width: 12px; height: 12px; stroke: var(--surface); stroke-width: 2.6; }
  body.run .tick { opacity: 1; transform: scale(1); }

  .caption { margin-top: 9px; width: 156px; margin-left: -30px; }
  .caption .t {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -.005em;
  }
  .caption .s {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.35;
    color: var(--ink-faint);
  }

  .lane {
    position: absolute;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    pointer-events: none;
  }

  /* ── Выдвижная панель ───────────────────────────────────────── */
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -8px 32px rgba(27,33,48,.16);
    transform: translateY(102%);
    transition: transform .28s cubic-bezier(.32,.72,.28,1);
    z-index: 40;
    max-height: 62vh;
    display: flex;
    flex-direction: column;
  }
  .sheet.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .box, .tick, .counts, .wire { transition: none; }
  }

  .sheet-head {
    flex: none;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-icon {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: grid; place-items: center;
  }
  .sheet-icon svg { width: 21px; height: 21px; stroke: var(--accent); fill: none;
                    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title h2 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .sheet-title .who {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
  }
  .sheet-close {
    flex: none;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink-muted);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: grid; place-items: center;
  }
  .sheet-close:hover { color: var(--ink); }

  .sheet-body { padding: 16px 20px 22px; overflow-y: auto; }
  .sheet-body p {
    margin: 0 0 14px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-muted);
    max-width: 68ch;
  }

  .chips { display: none; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  body.run .chips { display: flex; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--ok-soft);
    border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ok);
    font-variant-numeric: tabular-nums;
  }
  .chip b { font-weight: 600; }
  .chip .k { color: var(--ink-faint); font-weight: 400; }

  .out-label {
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  pre {
    margin: 0;
    padding: 13px 15px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.65;
    color: var(--ink);
    tab-size: 2;
  }
  .j-key { color: var(--accent); }
  .j-str { color: var(--ok); }
  .j-num { color: var(--ink); font-weight: 600; }
  .j-bool { color: var(--ink-muted); font-style: italic; }

  .hint {
    position: absolute;
    left: 60px; top: 22px;
    font-size: 12px;
    color: var(--ink-faint);
    pointer-events: none;
  }

  /* ── Телефон ────────────────────────────────────────────────── */
  @media (max-width: 700px) {
    header { padding: 10px 14px; gap: 10px; }
    .brand .sub { display: none; }
    .brand h1 { font-size: 14px; }
    .runline { font-size: 10.5px; }
    .toggle button { padding: 5px 9px; font-size: 12px; }
    .zoom .val { display: none; }
    .zoom button { width: 24px; }
    /* Времени прогона в шапке нет места — оно и так есть в чипсах панели */
    body.run .runline { display: none; }
    .hint { left: 26px; top: 16px; font-size: 11px; max-width: 300px; }
    .sheet { max-height: 68vh; }
    .sheet-head { padding: 14px 16px 10px; }
    .sheet-body { padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); }
    pre { font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Конвейер «Твой урок»</h1>
    <span class="sub">заявка учителя → презентация с проверкой по ФГОС</span>
  </div>
  <div class="spacer"></div>
  <div class="runline"><span class="pulse"></span><span id="runstat">выполнено за 74,2 с</span></div>
  <div class="zoom" role="group" aria-label="Масштаб схемы">
    <button id="z-out" aria-label="Отдалить">−</button>
    <span class="val" id="z-val">100%</span>
    <button id="z-in" aria-label="Приблизить">+</button>
  </div>
  <div class="toggle" role="group" aria-label="Режим просмотра">
    <button id="btn-edit" aria-pressed="true">Редактор</button>
    <button id="btn-run" aria-pressed="false">Прогон</button>
  </div>
</header>

<div class="viewport">
  <div class="stage">
    <div class="canvas" id="canvas">
      <div class="hint">Нажмите на ноду — покажу, что она делает и что отдаёт дальше</div>
      <svg class="wires" id="wires" viewBox="0 0 2160 680" preserveAspectRatio="none"></svg>
    </div>
  </div>
</div>

<aside class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-head">
    <div class="sheet-icon" id="sheet-icon"></div>
    <div class="sheet-title">
      <h2 id="sheet-name"></h2>
      <div class="who" id="sheet-who"></div>
    </div>
    <button class="sheet-close" id="sheet-close" aria-label="Закрыть панель">×</button>
  </div>
  <div class="sheet-body">
    <p id="sheet-text"></p>
    <div class="chips" id="sheet-chips"></div>
    <div class="out-label">Выход ноды</div>
    <pre id="sheet-json"></pre>
  </div>
</aside>

<script>
"use strict";

/* Иконки — простые штриховые, рисуются inline (без внешних зависимостей) */
const ICON = {

  pdf:   '<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v5h5"/><path d="M8 15h2a1.5 1.5 0 0 0 0-3H8v5"/>',
  box:   '<path d="M21 8v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M2 4h20v4H2z"/><path d="M10 12h4"/>',

/* ── Ноды: реальные стадии конвейера ───────────────────────────── */
const NODES = [
  { id:"in", x:60, y:296, icon:"bolt", trigger:true,

    who:"HTTP-триггер · вход конвейера",

    chips:[["принято","1 заявка"],["время","0,04 с"]],
    json:{ type:"presentation", subject:"История России", grade:6,
           topic:"Правление Василия III", fgos_mode:"full",
           wishes:"акцент на присоединении Пскова", source_doc_id:"doc_8f21" } },

  { id:"src", x:268, y:168, icon:"doc",

    who:"локальная модель · multilingual-e5-large",
    text:"Учебник превращается в куски текста, и к каждому считается «отпечаток смысла». Дальше автор получит не всю книгу, а те два-три абзаца, что относятся к теме. Именно поэтому слайды пишутся по источнику, а не по памяти модели.",
    chips:[["чанков","34"],["время","2,10 с"],["стоимость","0 ₽"]],
    json:{ doc_id:"doc_8f21", pages:412, chunks:34,
           embedder:"intfloat/multilingual-e5-large",
           top_k:[{ id:"c_118", score:0.87,
                    text:"Великий князь запретил своим братьям чеканить монету…" },
                  { id:"c_121", score:0.81,
                    text:"13 января 1510 года псковский вечевой колокол…" }] } },

  { id:"fgos", x:268, y:424, icon:"book",
    name:"Требования ФГОС", sub:"реестр, редакция 2025",

/* Связи: где конвейер ветвится и сливается — ветвление настоящее */

  ["in","src",   "1"],
  ["in","fgos",  "1"],
  ["src","prompt","34"],
  ["fgos","prompt","7"],
  ["prompt","outline","1"],
  ["outline","content","13"],
  ["content","lint","13"],
  ["content","art","11"],
  ["lint","insp","13"],
  ["insp","render","13"],
  ["art","render","13"],
  ["render","pdf","13"],
  ["pdf","out","2"]
];

const LANES = [
  { x:1088, y:104, t:"Проверка" },
  { x:1088, y:404, t:"Графика" }
];

const byId = {};
NODES.forEach(n => byId[n.id] = n);
const canvas = document.getElementById("canvas");
const wires  = document.getElementById("wires");
const NS = "http://www.w3.org/2000/svg";
const S = 96;                          // сторона ноды

/* ── Рисуем ноды ───────────────────────────────────────────────── */
NODES.forEach(n => {
  const el = document.createElement("button");
  el.className = "node" + (n.trigger ? " trigger" : "");
  el.style.left = n.x + "px";
  el.style.top  = n.y + "px";
  el.dataset.id = n.id;
  el.setAttribute("aria-current", "false");
  el.innerHTML =
    '<div class="box"><svg viewBox="0 0 24 24">' + ICON[n.icon] + '</svg>' +
      '<span class="tick"><svg viewBox="0 0 24 24">' + ICON.tick + '</svg></span>' +
    '</div>' +
    '<div class="caption"><div class="t">' + n.name + '</div>' +
      '<div class="s">' + n.sub + '</div></div>';
  el.addEventListener("click", () => open(n.id));
  canvas.appendChild(el);
});

LANES.forEach(l => {
  const d = document.createElement("div");
  d.className = "lane";
  d.style.left = l.x + "px";
  d.style.top  = l.y + "px";
  d.textContent = l.t;
  canvas.appendChild(d);
});

/* ── Рисуем связи: кубические кривые между краями нод ──────────── */
const countsG = document.createElementNS(NS, "g");
countsG.setAttribute("class", "counts");

EDGES.forEach(([a, b, n]) => {
  const A = byId[a], B = byId[b];
  const x1 = A.x + S, y1 = A.y + S / 2;
  const x2 = B.x,     y2 = B.y + S / 2;
  const dx = Math.max(58, (x2 - x1) * 0.55);

  const p = document.createElementNS(NS, "path");
  p.setAttribute("class", "wire");
  p.setAttribute("d", `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
  p.dataset.a = a; p.dataset.b = b;
  wires.appendChild(p);

  // Счётчик — на середине кривой
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const w = 15 + n.length * 6;
  const r = document.createElementNS(NS, "rect");
  r.setAttribute("class", "count-bg");
  r.setAttribute("x", mx - w / 2); r.setAttribute("y", my - 9);
  r.setAttribute("width", w); r.setAttribute("height", 18);
  r.setAttribute("rx", 9);
  const t = document.createElementNS(NS, "text");
  t.setAttribute("class", "count");
  t.setAttribute("x", mx); t.setAttribute("y", my + 3.6);
  t.setAttribute("text-anchor", "middle");
  t.textContent = n;
  countsG.appendChild(r); countsG.appendChild(t);
});
wires.appendChild(countsG);

/* ── Подсветка JSON ────────────────────────────────────────────── */
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}
function paint(obj) {
  const raw = esc(JSON.stringify(obj, null, 2));
  return raw
    .replace(/"([^"\\]*(?:\\.[^"\\]*)*)"(\s*:)/g, '<span class="j-key">"$1"</span>$2')
    .replace(/:\s*"([^"\\]*(?:\\.[^"\\]*)*)"/g, ': <span class="j-str">"$1"</span>')
    .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="j-num">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="j-bool">$1</span>');
}

/* ── Панель ────────────────────────────────────────────────────── */
const sheet = document.getElementById("sheet");
let current = null;

function open(id) {
  const n = byId[id];
  current = id;

  document.querySelectorAll(".node").forEach(el =>
    el.setAttribute("aria-current", String(el.dataset.id === id)));
  document.querySelectorAll(".wire").forEach(w =>
    w.classList.toggle("lit", w.dataset.a === id || w.dataset.b === id));

  document.getElementById("sheet-icon").innerHTML =
    '<svg viewBox="0 0 24 24">' + ICON[n.icon] + '</svg>';
  document.getElementById("sheet-name").textContent = n.name;
  document.getElementById("sheet-who").textContent  = n.who;
  document.getElementById("sheet-text").textContent = n.text;
  document.getElementById("sheet-chips").innerHTML =
    n.chips.map(([k, v]) =>
      '<span class="chip"><span class="k">' + k + '</span><b>' + v + '</b></span>').join("");
  document.getElementById("sheet-json").innerHTML = paint(n.json);

  sheet.classList.add("open");
  document.body.classList.add("picking");
  keepInView(id);
}

/* Панель занимает низ экрана — выбранная нода не должна оказаться
   под ней или за краем холста. */
function keepInView(id) {
  const el = document.querySelector('.node[data-id="' + id + '"]');
  if (!el) return;
  const vp = document.querySelector(".viewport");
  const box = el.getBoundingClientRect();
  const win = vp.getBoundingClientRect();
  /* Панель ещё уезжает по transition, поэтому берём её будущий верх
     из высоты, а не из текущей позиции. */
  const visibleBottom = Math.min(win.bottom, window.innerHeight - sheet.offsetHeight);

  const padX = 24;
  if (box.left < win.left + padX)        vp.scrollLeft -= win.left + padX - box.left;
  else if (box.right > win.right - padX) vp.scrollLeft += box.right - (win.right - padX);

  const padY = 16;
  if (box.top < win.top + padY)              vp.scrollTop -= win.top + padY - box.top;
  else if (box.bottom > visibleBottom - padY) vp.scrollTop += box.bottom - (visibleBottom - padY);
}

function close() {
  sheet.classList.remove("open");
  document.body.classList.remove("picking");
  current = null;
  document.querySelectorAll(".node").forEach(el => el.setAttribute("aria-current", "false"));
  document.querySelectorAll(".wire").forEach(w => w.classList.remove("lit"));
}

document.getElementById("sheet-close").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape" && current) close(); });

/* ── Режимы ────────────────────────────────────────────────────── */
const bEdit = document.getElementById("btn-edit");
const bRun  = document.getElementById("btn-run");

function mode(run) {
  document.body.classList.toggle("run", run);
  bEdit.setAttribute("aria-pressed", String(!run));
  bRun.setAttribute("aria-pressed", String(run));
}
bEdit.addEventListener("click", () => mode(false));
bRun.addEventListener("click",  () => mode(true));

/* ── Масштаб ───────────────────────────────────────────────────── */
const STEPS = [0.4, 0.5, 0.65, 0.8, 1];
const zVal = document.getElementById("z-val");
const zIn  = document.getElementById("z-in");
const zOut = document.getElementById("z-out");
let zi = STEPS.length - 1;

function applyZoom() {
  const z = STEPS[zi];
  document.documentElement.style.setProperty("--z", String(z));
  zVal.textContent = Math.round(z * 100) + "%";
  zOut.disabled = zi === 0;
  zIn.disabled  = zi === STEPS.length - 1;
}
zIn.addEventListener("click",  () => { if (zi < STEPS.length - 1) { zi++; applyZoom(); } });
zOut.addEventListener("click", () => { if (zi > 0)                { zi--; applyZoom(); } });

/* Стартовый масштаб — по ширине экрана: на телефоне схему надо видеть,
   а не разглядывать по одной ноде. */
const w = window.innerWidth;
zi = w < 520 ? 2 : w < 900 ? 3 : STEPS.length - 1;
applyZoom();
</script>
