<!doctype html>
<html lang="ru-RU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — букет улетел не туда · Егор &amp; Диана</title>
<meta name="description" content="Страница не найдена. Вернитесь к приглашению Егора и Дианы.">
<style>
  :root{
    --wine:#4a0008; --wine-soft:#7d1019; --wine-deep:#2a0003;
    --cream:#fbf6ec; --paper:#fffaf2; --gold:#c9a253; --gold-bright:#e8cf95;
    --ink:#211c19; --muted:#6f665e; --line:rgba(33,28,25,.14);
    --fast:cubic-bezier(.2,.8,.2,1);
    --font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --font-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh;
    padding:clamp(20px,6vw,48px);
    font-family:var(--font-text); color:var(--ink);
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(201,162,83,.18), transparent 60%),
      linear-gradient(180deg,var(--wine-deep),var(--wine) 55%,var(--wine-soft));
  }
  .card{
    width:100%; max-width:560px; text-align:center;
    background:var(--paper); border:1px solid var(--line);
    border-radius:22px; padding:clamp(28px,5vw,56px) clamp(20px,5vw,44px);
    box-shadow:0 30px 90px rgba(58,42,29,.35);
  }
  .bouquet-wrap{ position:relative; height:96px; margin-bottom:6px; }
  .bouquet{
    display:inline-block; font-size:clamp(46px,10vw,60px); cursor:pointer;
    background:transparent; border:0; padding:8px; line-height:1;
    animation:float 4.2s ease-in-out infinite;
    transform-origin:50% 85%;
  }
  .bouquet:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:50%; }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(4deg); }
  }
  .bouquet.caught{ animation:none; transform:translateY(0) rotate(0deg); transition:transform .5s var(--fast); }
  h1{
    font-family:var(--font-display); font-weight:600; margin:0 0 4px;
    font-size:clamp(3.2rem,10vw,5rem); color:var(--wine); letter-spacing:.02em;
  }
  .rule{ width:64px; height:2px; margin:14px auto 20px; background:var(--gold); border:0; }
  h2{
    font-family:var(--font-display); font-weight:600; margin:0 0 12px;
    font-size:clamp(1.3rem,3.4vw,1.7rem); color:var(--wine-deep);
  }
  p{ margin:0 0 8px; color:var(--muted); font-size:1rem; line-height:1.6; }
  #status{ min-height:1.4em; color:var(--gold-bright,#8a6c1f); font-weight:600; }
  nav{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
    margin-top:26px; padding-top:22px; border-top:1px solid var(--line);
  }
  nav a{
    font-family:var(--font-text); font-weight:600; font-size:.92rem;
    text-decoration:none; color:var(--wine);
    border:1px solid var(--gold); border-radius:999px;
    padding:10px 20px; transition:background .25s var(--fast), color .25s var(--fast), transform .25s var(--fast);
    display:inline-block;
  }
  nav a:hover, nav a:focus-visible{ background:var(--gold); color:var(--wine-deep); transform:translateY(-2px); }
  nav a:focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }
  nav a.primary{ background:var(--wine); color:var(--cream); border-color:var(--wine); }
  nav a.primary:hover, nav a.primary:focus-visible{ background:var(--wine-soft); color:var(--cream); }
  footer{ margin-top:18px; color:var(--muted); font-size:.8rem; letter-spacing:.04em; }
  @media (max-width:420px){
    nav{ flex-direction:column; }
    nav a{ width:100%; }
  }
  @media (prefers-reduced-motion:reduce){
    .bouquet{ animation:none; }
    nav a, .bouquet.caught{ transition:none; }
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="bouquet-wrap">
      <button type="button" class="bouquet" id="bouquet" aria-label="Букет невесты, декоративная кнопка: нажмите, чтобы поймать букет">💐</button>
    </div>
    <h1>404</h1>
    <hr class="rule" aria-hidden="true">
    <h2>Кажется, вы потерялись по пути к нам</h2>
    <p>Такой страницы не существует — похоже, букет улетел не в ту сторону, и вы вслед за ним.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <nav aria-label="Полезные ссылки">
      <a class="primary" href="/index.html">На главную</a>
      <a href="/index.html#program">К программе дня</a>
      <a href="/index.html#rsvp">Подтвердить участие</a>
    </nav>
    <footer>Егор &amp; Диана · 26.08.2026 · Санкт-Петербург</footer>
  </main>
  <script>
  (function(){
    "use strict";
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var bouquet = document.getElementById("bouquet");
    var status = document.getElementById("status");
    var caught = false;
    bouquet.addEventListener("click", function(){
      caught = !caught;
      if (!reduceMotion) bouquet.classList.toggle("caught", caught);
      status.textContent = caught
        ? "Поймали! По примете — вы следующие. Но страницу это, увы, не вернёт."
        : "";
      bouquet.setAttribute("aria-label", caught
        ? "Букет пойман. Нажмите ещё раз, чтобы отпустить его снова летать"
        : "Букет невесты, декоративная кнопка: нажмите, чтобы поймать букет");
    });
  })();
  </script>
</body>
</html>
