name: Deploy sites to GitHub Pages

on:
  push:
    branches:
      - "claude/website-analysis-claude-md-kd3foj"
      - "claude/pixel-rpg-vibe-coding-5mwc8p"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        # Wedding site at the Pages root, the RPG game as a separate page
        # at /vibe-coder-rpg/
        run: |
          mkdir -p _site
          cp -r yegor-diana-wedding/. _site/
          mkdir -p _site/vibe-coder-rpg
          cp -r vibe-coder-rpg/. _site/vibe-coder-rpg/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
