services:
  finance-bot:
    build: .
    container_name: finance-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/finance.db
      RECEIPTS_DIR: /app/data/receipts
    volumes:
      - ./data:/app/data
    # Ротация логов, чтобы при работе 24/7 не забить диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
