<title>Карта репозиториев</title>

<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #5c5c5c;
    --ink-faint: #8a8a8a;
    --line: #e2e2dd;
    --line-soft: #eeeeea;
    --accent: #7b2d3b;
    --accent-soft: #f3e6e8;
    --warn: #8a6a1f;
    --warn-soft: #f7efd8;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --card: #1b1b1f;
      --ink: #ededed;
      --ink-soft: #a8a8a8;
      --ink-faint: #757579;
      --line: #2e2e34;
      --line-soft: #26262b;
      --accent: #e4899a;
      --accent-soft: #332226;
      --warn: #e0be6a;
      --warn-soft: #322b18;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131316; --card: #1b1b1f; --ink: #ededed; --ink-soft: #a8a8a8;
    --ink-faint: #757579; --line: #2e2e34; --line-soft: #26262b;
    --accent: #e4899a; --accent-soft: #332226; --warn: #e0be6a; --warn-soft: #322b18;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1a1a1a; --ink-soft: #5c5c5c;
    --ink-faint: #8a8a8a; --line: #e2e2dd; --line-soft: #eeeeea;
    --accent: #7b2d3b; --accent-soft: #f3e6e8; --warn: #8a6a1f; --warn-soft: #f7efd8;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }

  /* ---- header ---- */
  .head { margin-bottom: 28px; }
  .head h1 {
    font-size: clamp(22px, 4vw, 30px);
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    font-family: var(--mono);
    font-weight: 600;
  }
  .head .sub { color: var(--ink-soft); font-size: 14px; }
  .search {
    margin-top: 18px; width: 100%; box-sizing: border-box;
    padding: 10px 14px; font-size: 15px; font-family: var(--sans);
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    transition: border-color .15s ease;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--ink-faint); }

  /* ---- card ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card.is-hidden { display: none; }
  .card.dormant { opacity: .62; }

  .c-top {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 10px; margin-bottom: 4px;
  }
  .c-name {
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    color: var(--ink); text-decoration: none;
  }
  .c-name:hover { color: var(--accent); }
  .badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 5px;
    background: var(--line-soft); color: var(--ink-soft);
  }
  .badge.private { background: var(--accent-soft); color: var(--accent); }
  .c-date { margin-left: auto; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
  .c-sum { color: var(--ink-soft); font-size: 14px; margin: 0 0 14px; }

  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .flag {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: var(--warn-soft); color: var(--warn);
  }

  /* ---- body columns ---- */
  .c-body { display: grid; grid-template-columns: minmax(0,1fr) 210px; gap: 24px; }
  @media (max-width: 680px) { .c-body { grid-template-columns: minmax(0,1fr); gap: 16px; } }

  .tree { overflow-x: auto; font-family: var(--mono); font-size: 13px; }
  .tree ul { list-style: none; margin: 0; padding: 0 0 0 15px; }
  .tree > ul { padding-left: 0; }
  .tree li { white-space: nowrap; line-height: 1.75; }
  .tree .dir > ul { display: none; }
  .tree .dir.open > ul { display: block; }
  .tw { cursor: pointer; user-select: none; color: var(--ink); }
  .tw:hover { color: var(--accent); }
  .tw .arw { display: inline-block; width: 11px; color: var(--ink-faint); }
  .file { color: var(--ink-soft); }
  .file .arw { display: inline-block; width: 11px; }
  .more { color: var(--ink-faint); font-style: italic; }
  .hit { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 3px; }
  .empty-tree { color: var(--ink-faint); font-size: 13px; font-style: italic; }

  .side h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-faint); margin: 0 0 7px; font-weight: 600;
  }
  .side ul { list-style: none; margin: 0 0 16px; padding: 0; }
  .side li { font-size: 13px; margin-bottom: 5px; word-break: break-word; }
  .br { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
  .br.def { color: var(--ink); font-weight: 600; }
  .br .tag { font-family: var(--sans); font-size: 11px; color: var(--ink-faint); }
  .pr a { color: var(--accent); text-decoration: none; }
  .pr a:hover { text-decoration: underline; }
  .pr .meta { display: block; font-size: 11.5px; color: var(--ink-faint); }

  .unreach { font-size: 13px; color: var(--warn); font-style: italic; }
  .noresult { text-align: center; color: var(--ink-faint); padding: 40px 0; display: none; }
  .noresult.on { display: block; }
</style>

<div class="wrap">
  <div class="head">
    <h1 id="owner"></h1>
    <div class="sub" id="sub"></div>
    <input class="search" id="q" type="search" placeholder="Фильтр: имя репозитория, файла или папки…" autocomplete="off">
  </div>
  <div id="list"></div>
  <div class="noresult" id="noresult">Ничего не найдено</div>
</div>

<script>
  const DATA = __REPO_MAP_DATA__;

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  function human(d) {
    if (!d) return '';
    const p = String(d).slice(0, 10).split('-');
    if (p.length < 3) return String(d);
    return `${Number(p[2])} ${MONTHS[Number(p[1]) - 1] || ''} ${p[0]}`;
  }

  function treeHTML(nodes, depth) {
    if (!nodes || !nodes.length) return '';
    let out = '<ul>';
    for (const n of nodes) {
      const name = esc(n.name);
      if (n.type === 'dir') {
        const open = depth < 2 ? ' open' : '';
        out += `<li class="dir${open}" data-name="${name.toLowerCase()}">` +
          `<span class="tw"><span class="arw">▸</span>${name}/</span>` +
          treeHTML(n.children, depth + 1) + '</li>';
      } else if (n.type === 'more') {
        out += `<li class="more"><span class="arw"></span>${name}</li>`;
      } else {
        out += `<li class="file" data-name="${name.toLowerCase()}">` +
          `<span class="arw"></span>${name}</li>`;
      }
    }
    return out + '</ul>';
  }

  function sideHTML(r) {
    let h = '';
    const brs = r.branches || [];
    if (brs.length) {
      h += '<h3>Ветки</h3><ul>';
      for (const b of brs) {
        const tag = b.isDefault ? ' <span class="tag">основная</span>'
          : b.pr ? ` <span class="tag">PR #${esc(b.pr)}</span>`
          : ' <span class="tag">без PR</span>';
        h += `<li class="br${b.isDefault ? ' def' : ''}">${esc(b.name)}${tag}</li>`;
      }
      h += '</ul>';
    }
    const prs = r.pulls || [];
    if (prs.length) {
      h += '<h3>Открытые PR</h3><ul>';
      for (const p of prs) {
        const age = p.ageDays != null ? `${p.ageDays} дн.` : '';
        const draft = p.draft ? 'черновик · ' : '';
        h += `<li class="pr"><a href="${esc(p.url)}" target="_blank" rel="noopener">` +
          `#${esc(p.number)} ${esc(p.title)}</a>` +
          `<span class="meta">${draft}${age}</span></li>`;
      }
      h += '</ul>';
    }
    return h;
  }

  function cardHTML(r) {
    const priv = r.visibility === 'private';
    const dormant = (r.flags || []).some(f => f.kind === 'dormant');
    let h = `<div class="card${dormant ? ' dormant' : ''}" data-repo="${esc(r.name).toLowerCase()}">`;
    h += '<div class="c-top">';
    h += `<a class="c-name" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`;
    h += `<span class="badge${priv ? ' private' : ''}">${priv ? '🔒 private' : 'public'}</span>`;
    h += `<span class="c-date">push ${esc(human(r.pushedAt))}</span>`;
    h += '</div>';
    if (r.summary) h += `<p class="c-sum">${esc(r.summary)}</p>`;
    if ((r.flags || []).length) {
      h += '<div class="flags">' +
        r.flags.map(f => `<span class="flag">${esc(f.text)}</span>`).join('') +
        '</div>';
    }
    h += '<div class="c-body"><div class="tree">';
    if (r.unreachable) {
      h += '<div class="unreach">Репозиторий не подключён к сессии — дерево файлов недоступно</div>';
    } else if (r.tree && r.tree.length) {
      h += treeHTML(r.tree, 0);
    } else {
      h += '<div class="empty-tree">дерево не собрано</div>';
    }
    h += '</div><div class="side">' + sideHTML(r) + '</div></div></div>';
    return h;
  }

  // ---- render ----
  const repos = (DATA.repos || []).slice().sort((a, b) =>
    String(b.pushedAt || '').localeCompare(String(a.pushedAt || '')));

  document.getElementById('owner').textContent = DATA.owner + '/';
  document.getElementById('sub').textContent =
    `${repos.length} ${plural(repos.length)} · собрано ${human(DATA.generatedAt)}`;
  document.getElementById('list').innerHTML = repos.map(cardHTML).join('');

  function plural(n) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'репозиторий';
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'репозитория';
    return 'репозиториев';
  }

  // ---- expand / collapse ----
  document.getElementById('list').addEventListener('click', e => {
    const tw = e.target.closest('.tw');
    if (!tw) return;
    const li = tw.parentElement;
    li.classList.toggle('open');
    tw.querySelector('.arw').textContent = li.classList.contains('open') ? '▾' : '▸';
  });

  document.querySelectorAll('.dir').forEach(li => {
    if (li.classList.contains('open')) li.querySelector('.arw').textContent = '▾';
  });

  // ---- filter ----
  const q = document.getElementById('q');
  const noresult = document.getElementById('noresult');

  q.addEventListener('input', () => {
    const term = q.value.trim().toLowerCase();
    let shown = 0;

    document.querySelectorAll('.card').forEach(card => {
      card.querySelectorAll('.hit').forEach(el => {
        el.replaceWith(document.createTextNode(el.textContent));
        });
      card.normalize();

      if (!term) {
        card.classList.remove('is-hidden');
        card.querySelectorAll('.dir').forEach((li, i) => {
          const deep = li.parentElement.closest('.dir');
          const shouldOpen = !deep || !deep.parentElement.closest('.dir');
          li.classList.toggle('open', shouldOpen);
          li.querySelector('.arw').textContent = shouldOpen ? '▾' : '▸';
        });
        shown++;
        return;
      }

      const nameHit = card.dataset.repo.includes(term);
      const nodes = [...card.querySelectorAll('[data-name]')]
        .filter(li => li.dataset.name.includes(term));

      if (!nameHit && !nodes.length) { card.classList.add('is-hidden'); return; }
      card.classList.remove('is-hidden');
      shown++;

      nodes.forEach(li => {
        const label = li.classList.contains('dir') ? li.querySelector('.tw') : li;
        const txt = [...label.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
        if (txt) {
          const i = txt.textContent.toLowerCase().indexOf(term);
          if (i > -1) {
            const span = document.createElement('span');
            span.className = 'hit';
            span.textContent = txt.textContent.slice(i, i + term.length);
            const after = txt.splitText(i);
            after.textContent = after.textContent.slice(term.length);
            label.insertBefore(span, after);
          }
        }
        let p = li.parentElement.closest('.dir');
        while (p) {
          p.classList.add('open');
          p.querySelector('.arw').textContent = '▾';
          p = p.parentElement.closest('.dir');
        }
      });
    });

    noresult.classList.toggle('on', shown === 0);
  });
</script>
