name: Deploy site + voxel game to GitHub Pages

on:
  push:
    branches: ["claude/website-analysis-claude-md-kd3foj"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (wedding at root, game under /voxel-game/)
        run: |
          mkdir -p _site/voxel-game
          cp -r yegor-diana-wedding/. _site/
          cp -r voxel-game/. _site/voxel-game/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
